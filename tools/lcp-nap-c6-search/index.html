<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCP / NAP Box Coordinate Search</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#0b1b33}
.wrap{max-width:680px;margin:0 auto;padding:38px 18px}h1{text-align:center;font-size:28px;margin:8px 0 14px}
.sub{text-align:center;font-size:18px;color:#354a66;margin-bottom:30px}
.card{background:#fff;border:1px solid #d7dee7;border-radius:22px;padding:26px;box-shadow:0 2px 5px #00000012}
label{display:block;font-weight:700;font-size:17px;margin-bottom:10px}
input{width:100%;height:72px;border:1px solid #cbd3de;border-radius:18px;background:#f7f8fa;padding:0 20px;font-size:22px}
button.search{width:100%;height:68px;border:0;border-radius:18px;background:#0877d5;color:#fff;font-weight:700;font-size:21px;margin-top:20px}
.status{text-align:center;margin:30px 0 18px;font-size:18px}
.item{background:#fff;border:1px solid #d7dee7;border-radius:18px;padding:18px;margin:12px 0}
.box{font-size:19px;font-weight:700;margin-bottom:12px}.coords{font-size:20px;font-weight:700;margin:7px 0}
.meta{color:#44556e;margin-top:7px}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions button,.actions a{flex:1;min-width:150px;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:12px;background:#eef3f8;color:#123;font-weight:700;font-size:14px}
</style>
</head><body>
<main class="wrap">
<h1>LCP / NAP Box Coordinate Search</h1>
<div class="sub">Easy mobile search • Search by Box Name or OLT code</div>
<section class="card">
<label>BOX NAME / OLT CODE <span style="color:red">*</span></label>
<input id="q" placeholder="e.g. MNL004 LP230 or MNL003" autocomplete="off" enterkeyhint="search">
<button class="search" id="search">Search Coordinates</button>
</section>
<div id="status" class="status">Loading full C6 inventory…</div>
<div id="results"></div>
</main>
<script>
const CHUNKS=22; let DATA=[], loaded=false;
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"' && text[i+1]=='"'){field+='"';i++;} else if(c=='"'){q=false;} else field+=c; }
    else { if(c=='"')q=true; else if(c==','){row.push(field);field='';} else if(c=='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field='';} else field+=c; }
  }
  if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row);}
  return rows;
}
async function loadData(){
  try{
    const reqs=[]; for(let i=1;i<=CHUNKS;i++) reqs.push(fetch('data-'+String(i).padStart(2,'0')+'.csv?b=20260919').then(r=>{if(!r.ok)throw new Error('chunk');return r.text()}));
    const texts=await Promise.all(reqs);
    for(const text of texts){
      const rows=parseCSV(text); if(!rows.length)continue;
      const hdr=rows[0]; const ix=n=>hdr.indexOf(n);
      for(let j=1;j<rows.length;j++){const r=rows[j]; if(!r[ix('Box Name')])continue;
        DATA.push({box:r[ix('Box Name')]||'',olt:r[ix('OLT')]||'',municipality:r[ix('Municipality')]||'',barangay:r[ix('Barangay')]||'',lat:r[ix('Latitude')]||'',lon:r[ix('Longitude')]||''});
      }
    }
    loaded=true; document.getElementById('status').textContent='Ready • '+DATA.length.toLocaleString()+' records loaded';
  }catch(e){document.getElementById('status').textContent='Could not load inventory. Please refresh.';}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function search(){
  const q=document.getElementById('q').value.trim().toUpperCase(), status=document.getElementById('status'), results=document.getElementById('results'); results.innerHTML='';
  if(!loaded){status.textContent='Inventory is still loading. Please wait a moment.';return}
  if(!q){status.textContent='Ready • '+DATA.length.toLocaleString()+' records loaded';return}
  const all=DATA.filter(r=>(r.box||'').toUpperCase().includes(q)||(r.olt||'').toUpperCase().includes(q)); const hits=all.slice(0,100);
  if(!hits.length){status.textContent='No matches found for "'+q+'".';return}
  status.textContent=all.length+' match'+(all.length===1?'':'es')+' found'+(all.length>100?' • showing first 100':'');
  results.innerHTML=hits.map(r=>{const coord=r.lat+', '+r.lon,map='https://www.google.com/maps?q='+encodeURIComponent(r.lat+','+r.lon);
    return '<div class="item"><div class="box">'+esc(r.box)+'</div><div class="coords">Latitude: '+esc(r.lat)+'</div><div class="coords">Longitude: '+esc(r.lon)+'</div><div class="meta">'+esc(r.municipality)+' • '+esc(r.barangay)+'</div><div class="actions"><button data-c="'+esc(coord)+'" onclick="navigator.clipboard.writeText(this.dataset.c);this.textContent=\'Copied!\'">Copy Coordinates</button><a href="'+map+'" target="_blank">Open in Google Maps</a></div></div>';
  }).join('');
}
document.getElementById('search').onclick=search; document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()}); loadData();
</script></body></html>
